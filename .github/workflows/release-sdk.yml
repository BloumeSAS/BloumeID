name: Release SDK (@bloumeid/sdk)

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-sdk:
    name: Version & Publish @bloumeid/sdk to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js 22 with npm registry & OIDC provenance
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SDK tests, build & export checks before release
        run: |
          pnpm --filter @bloumeid/sdk test:coverage
          pnpm --filter @bloumeid/sdk build
          cd packages/bloumeid
          npm pack --dry-run
          npx publint
          npm pack
          npx attw bloumeid-sdk-*.tgz
          rm -f bloumeid-sdk-*.tgz

      - name: Configure git identity for github-actions[bot]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create Version Packages PR or Publish to npm with provenance
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm --filter @bloumeid/sdk exec npm publish --provenance --access public
          commit: "chore(release): version @bloumeid/sdk packages"
          title: "chore(release): version @bloumeid/sdk packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create sdk-vX.Y.Z tag on publish
        if: steps.changesets.outputs.published == 'true'
        run: |
          SDK_VERSION=$(node -p "require('./packages/bloumeid/package.json').version")
          TAG_NAME="sdk-v${SDK_VERSION}"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi

