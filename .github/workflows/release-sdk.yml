name: Release SDK (@bloume/id)

on:
  push:
    tags:
      - "sdk-v*"
    branches:
      - main
    paths:
      - "packages/bloumeid/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-sdk:
    name: Test, Validate & Publish @bloume/id to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SDK typecheck, lint, tests, build, publint & attw
        run: |
          pnpm --filter @bloume/id typecheck
          pnpm --filter @bloume/id lint
          pnpm --filter @bloume/id test
          pnpm --filter @bloume/id build
          cd packages/bloumeid
          npx publint
          npm pack
          npx attw bloume-id-*.tgz
          rm -f bloume-id-*.tgz

      - name: Configure npm auth token
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @bloume/id to npm
        run: pnpm --filter @bloume/id publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        uses: softprops/action-github-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
