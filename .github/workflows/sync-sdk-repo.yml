name: Sync @bloume/id to BloumeSAS/bloumeid-sdk

on:
  push:
    branches: [main]
    paths:
      - "packages/bloumeid/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push packages/bloumeid to BloumeSAS/bloumeid-sdk
        env:
          SDK_REPO_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          if [ -z "$SDK_REPO_TOKEN" ]; then
            echo "SDK_REPO_TOKEN is not set, skipping sync."
            exit 0
          fi
          git clone "https://x-access-token:${SDK_REPO_TOKEN}@github.com/BloumeSAS/bloumeid-sdk.git" /tmp/bloumeid-sdk
          rsync -av --delete --exclude='.git' --exclude='node_modules' --exclude='dist' packages/bloumeid/ /tmp/bloumeid-sdk/
          cd /tmp/bloumeid-sdk
          git config user.name "Bloume Bot"
          git config user.email "bot@bloume.fr"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(sdk): sync @bloume/id from BloumeID (${GITHUB_SHA::7})"
            git push origin main
          fi

