services:
  bloumeid-db:
    image: postgres:17-alpine
    container_name: bloumeid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bloumeid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloumeid_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bloumeid}
    volumes:
      - bloumeid_pgdata:/var/lib/postgresql/data
    networks:
      - bloumeid_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloumeid} -d ${POSTGRES_DB:-bloumeid}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bloumeid-redis:
    image: valkey/valkey:8-alpine
    container_name: bloumeid-redis
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - bloumeid_valkeydata:/data
    networks:
      - bloumeid_internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  bloumeid-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/bloume-sas/bloumeid:latest
    container_name: bloumeid-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bloumeid:bloumeid_dev_password@bloumeid-db:5432/bloumeid?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://bloumeid-redis:6379}
      GEOIP_DIR: /app/data/geoip
    volumes:
      - ./data:/app/data
    depends_on:
      bloumeid-db:
        condition: service_healthy
      bloumeid-redis:
        condition: service_healthy
    networks:
      - bloumeid_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bloumeid_pgdata:
  bloumeid_valkeydata:

networks:
  bloumeid_internal:
    driver: bridge
