services:
  bloumeid-db:
    image: postgres:17-alpine
    container_name: bloumeid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bloumeid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloumeid_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bloumeid}
    volumes:
      - bloumeid_pgdata:/var/lib/postgresql/data
    networks:
      - bloumeid_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloumeid} -d ${POSTGRES_DB:-bloumeid}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bloumeid-redis:
    image: valkey/valkey:8-alpine
    container_name: bloumeid-redis
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - bloumeid_valkeydata:/data
    networks:
      - bloumeid_backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  bloumeid-web:
    image: bloumesas/bloumeid:latest
    container_name: bloumeid-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      ADMIN_MASTER_KEY: ${ADMIN_MASTER_KEY:-bloumeid_dev_master_key_2026}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bloumeid:bloumeid_dev_password@bloumeid-db:5432/bloumeid?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://bloumeid-redis:6379}
      WORKER_ID: ${WORKER_ID:-1}
      BLOUMEID_PUBLIC_URL: ${BLOUMEID_PUBLIC_URL:-http://localhost:3000}
      NEXT_PUBLIC_BLOUMEID_PUBLIC_URL: ${NEXT_PUBLIC_BLOUMEID_PUBLIC_URL:-http://localhost:3000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-true}
      TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS:-true}
      GEOIP_DIR: ${GEOIP_DIR:-/app/data/geoip}
      GEOIP_DATA_DIR: ${GEOIP_DATA_DIR:-/app/data/geoip}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      bloumeid-db:
        condition: service_healthy
      bloumeid-redis:
        condition: service_healthy
    networks:
      - bloumeid_backend
      - bloumeid_public
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bloumeid_pgdata:
  bloumeid_valkeydata:

networks:
  bloumeid_backend:
    driver: bridge
    internal: true
  bloumeid_public:
    driver: bridge
